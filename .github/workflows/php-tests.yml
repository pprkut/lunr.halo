name: PHP Tests
on: [push, pull_request, workflow_dispatch]

jobs:
  php-tests:
    uses: lunr-php/actions-templates/.github/workflows/php-composer.yml@f74ef263f5d0ff4c00ddc2554b7edf99251aca96 # next
    with:
      coding-standard: 'Lunr'
      minimum-php-version: '8.3'
      stable-php-versions: '["8.3"]'
      experimental-php-versions: '["8.4","8.5"]'
      phpcs-whitelist: tests/phpstan.autoload.inc.php tests/test.bootstrap.inc.php
      php-extensions: uopz
